<title>Maison Panel</title>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<link rel="stylesheet" href="css/panel.css" />

<div id="panel">
  <header id="tile-header">
    <span class="clock-time"></span>
    <span class="clock-date"></span>
  </header>

  <main id="tile-main">
    <section id="tile-weather">
      <h2 class="section-label">Aujourd'hui <span class="weather-location"></span></h2>
      <div class="hero-temp value-fade"></div>
      <div class="hero-sub value-fade"></div>
      <div class="hourly-strip"></div>
      <div class="daily-rows"></div>
      <div class="stale-note"></div>
      <div class="attribution">Weather data by Open-Meteo.com (CC BY 4.0)</div>
    </section>

    <section id="tile-calendar">
      <h2 class="section-label">Calendrier</h2>
      <div class="calendar-embed-container"></div>
    </section>

    <section id="tile-side">
      <div id="tile-solunar">
        <h2 class="section-label">Pêche</h2>
        <button class="moon-toggle" type="button" aria-expanded="false" aria-label="Afficher les détails de pêche">
          <span class="moon-disc"></span>
        </button>
        <div class="solunar-details" hidden>
          <div class="moon-phase-label"></div>
          <div class="next-period value-fade"></div>
          <div class="day-rating"></div>
          <div class="solunar-periods"></div>
        </div>
      </div>
      <div id="tile-markets">
        <div class="markets-heading">
          <h2 class="section-label">Marchés</h2>
          <button class="market-toggle" type="button" aria-expanded="false">Afficher plus</button>
        </div>
        <div class="market-list"></div>
        <div class="market-note stale-note"></div>
      </div>
      <div id="tile-spotify">
        <h2 class="section-label">Musique</h2>
        <div class="spotify-body"></div>
      </div>
    </section>
  </main>

  <section id="today-strip" aria-label="Conditions du jour">
    <div class="today-metric" data-metric="uv"></div>
    <div class="today-metric" data-metric="rain"></div>
    <div class="today-metric" data-metric="wind"></div>
    <div class="today-metric" data-metric="air"></div>
    <div class="today-daylight">
      <div class="today-daylight-heading"><span>Jour</span><span class="daylight-percent"></span></div>
      <div class="daylight-track"><span></span></div>
      <div class="today-daylight-times"></div>
    </div>
    <div class="today-alert" hidden></div>
  </section>

</div>

<div id="offline-indicator"></div>

<script type="module" src="js/app.js"></script>
